name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write  # Required for NuGet trusted publisher OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build Release
        run: msbuild Wer.Winforms.Toolkit/Wer.Winforms.Toolkit.csproj /p:Configuration=Release /verbosity:minimal

      - name: Pack
        run: nuget pack Wer.Winforms.Toolkit/Wer.Winforms.Toolkit.nuspec -OutputDirectory nupkg

      - name: Push to NuGet (Trusted Publisher)
        run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json
