name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write  # Required for NuGet trusted publisher OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build Release
        run: msbuild Wer.Winforms.Toolkit/Wer.Winforms.Toolkit.csproj /p:Configuration=Release /verbosity:minimal

      - name: Pack
        run: nuget pack Wer.Winforms.Toolkit/Wer.Winforms.Toolkit.nuspec -OutputDirectory nupkg

      - name: Get NuGet API token (Trusted Publisher OIDC)
        id: get-token
        shell: pwsh
        run: |
          $token = (Invoke-RestMethod "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=nuget.org" `
            -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          $response = Invoke-RestMethod -Method POST `
            -Uri "https://api.nuget.org/v3/authentication/authenticate" `
            -Body (@{ identityToken = $token } | ConvertTo-Json) `
            -ContentType "application/json"
          echo "::add-mask::$($response.apiKey)"
          echo "NUGET_API_KEY=$($response.apiKey)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Push to NuGet (Trusted Publisher)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem nupkg\*.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
