name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build Release
        run: msbuild Wer.Winforms.Toolkit/Wer.Winforms.Toolkit.csproj /p:Configuration=Release /verbosity:minimal

      - name: Pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          nuget pack Wer.Winforms.Toolkit/Wer.Winforms.Toolkit.nuspec -OutputDirectory nupkg -Version $version

      - name: Login to NuGet.org (OIDC token exchange)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: jagwit

      - name: Push to NuGet (Trusted Publisher)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem nupkg\*.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName `
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
